# 本地开发用 MySQL 8：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: class-directory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: class_directory
      MYSQL_USER: classbook
      MYSQL_PASSWORD: classbook123
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
